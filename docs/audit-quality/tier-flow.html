<figure><svg viewBox="0 0 1000 350" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Evidence-to-acceptance workflow with a repair loop</title><desc id="flow-desc">Freeze scope and evidence; build the report; validate claims and rendering; obtain independent review. A failure returns to the authoritative source for repair and regeneration. A pass allows authorized delivery and verified readback. A missing permission or exhausted budget creates a hold.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#12665d"/></marker></defs><g fill="#e6f0eb" stroke="#12665d" stroke-width="2"><rect x="15" y="40" width="170" height="95" rx="8"/><rect x="215" y="40" width="170" height="95" rx="8"/><rect x="415" y="40" width="170" height="95" rx="8"/><rect x="615" y="40" width="170" height="95" rx="8"/><rect x="815" y="40" width="170" height="95" rx="8"/><rect x="315" y="235" width="370" height="85" rx="8" fill="#fff3db"/></g><g fill="#182f38" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle"><text x="100" y="78">Freeze scope</text><text x="100" y="107">and evidence</text><text x="300" y="78">Build the</text><text x="300" y="107">bounded report</text><text x="500" y="78">Check claims</text><text x="500" y="107">and render</text><text x="700" y="78">Independent</text><text x="700" y="107">final review</text><text x="900" y="78">Authorized</text><text x="900" y="107">delivery + verify</text><text x="500" y="269">Fix the authoritative source</text><text x="500" y="299">Regenerate affected outputs</text><text x="747" y="185" font-size="17">FAIL / missing evidence</text><text x="790" y="28" font-size="16">PASS + authority</text></g><g fill="none" stroke="#12665d" stroke-width="3" marker-end="url(#arrow)"><path d="M185 88H210"/><path d="M385 88H410"/><path d="M585 88H610"/><path d="M785 88H810"/><path d="M700 135V215H590V230"/><path d="M315 277H280V142"/></g></svg><ol class="mobile-flow" aria-label="Audit workflow"><li>1. Freeze scope and evidence</li><li>2. Build the bounded report</li><li>3. Check claims and rendered pages</li><li>4. Independently review final revision</li><li>5. Authorize delivery, then verify access</li></ol><p class="mobile-repair"><strong>If a check fails:</strong> repair the authoritative source, rebuild affected outputs, and return to checking. Missing authority or exhausted budget means HOLD.</p><figcaption>Text equivalent: freeze → build → validate → independent final review → authorized delivery and readback. Defects return to source, then every affected output is rebuilt and rechecked. Missing authority or exhausted resources means HOLD, never a lower pass line.</figcaption></figure>
