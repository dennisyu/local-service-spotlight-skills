name: Validate skills marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a shared release-version bump for marketplace changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_release_version.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Require a shared release-version bump on direct main pushes
        if: github.event_name == 'push'
        run: python3 scripts/check_release_version.py --base-ref "${{ github.event.before }}"
      - name: Check shared house rules are current in every skill
        run: python3 scripts/sync_shared_rules.py --check
      - name: Prove every house rule's checks actually fire
        run: python3 scripts/fleet_check.py --self-test
      - name: Validate repository structure and references
        run: python3 scripts/validate_marketplace.py
      - name: Run converter tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Claude's marketplace validator
        run: npx -y @anthropic-ai/claude-code@latest plugin validate .
