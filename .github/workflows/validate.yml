name: Validate skills marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shared house rules are current in every skill
        run: python3 scripts/sync_shared_rules.py --check
      - name: Prove every house rule's checks actually fire
        run: python3 scripts/fleet_check.py --self-test
      - name: Validate repository structure and references
        run: python3 scripts/validate_marketplace.py
      - name: Run converter tests
        run: python3 -m unittest discover -s tests -v
      - name: Install local clip checker test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prove clip defects fail and visual review is required
        run: python3 -m unittest discover -s tools -p 'test_check_hero_loops.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Prove rendered first-screen gates on real browser fixtures
        run: node --test tests/rendered_visual_check.test.mjs
      - name: Run Claude's marketplace validator
        run: npx -y @anthropic-ai/claude-code@latest plugin validate .
